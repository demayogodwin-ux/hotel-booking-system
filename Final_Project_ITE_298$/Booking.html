<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Booking System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Hotel Booking</h1>
        <p>Reserve your comfortable stay with us</p>
      </div>

      <div class="booking-card">
        <form action="booking.php" method="post">
          <h2>Guest Information</h2>
          <div class="form-group">
            <label for="address">Complete Address</label>
            <input
              type="text"
              id="address"
              name="address"
              placeholder="House No. Street, Barangay"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter city"
                required
              />
            </div>

            <div class="form-group">
              <label for="country">Country</label>
              <select required id="country" name="country">
                <option value="">Select country</option>
                <option>Philippines</option>
                <option>United States</option>
                <option>Japan</option>
                <option>South Korea</option>
                <option>Singapore</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="guests">Number of Guests</label>
            <select required id="guests" name="guests">
              <option value="">Select guests</option>
              <option value="1">1 Guest</option>
              <option value="2">2 Guests</option>
              <option value="3">3 Guests</option>
              <option value="4">4 Guests</option>
              <option value="5">5+ Guests</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="room">Room Type</label>
              <select required id="room" name="room_type">
                <option value="">Select room type</option>
                <option>Standard Room</option>
                <option>Deluxe Room</option>
                <option>Family Room</option>
                <option>Suite Room</option>
                <option>Presidential Suite</option>
              </select>
            </div>

            <div class="form-group">
              <label for="room_number">Room Number</label>
              <select required id="room_number" name="room_number">
                <option value="">Select room</option>
                <option value="101">101</option>
                <option value="102">102</option>
                <option value="103">103</option>
                <option value="201">201</option>
                <option value="202">202</option>
                <option value="203">203</option>
                <option value="301">301</option>
                <option value="302">302</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="check_in">Check-in Date</label>
              <input type="date" id="check_in" name="check_in" required />
            </div>

            <div class="form-group">
              <label for="check_out">Check-out Date</label>
              <input type="date" id="check_out" name="check_out" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="payment">Payment Method</label>
              <select required id="payment" name="payment">
                <option value="">Select payment method</option>
                <option value="Cash">Cash</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Gcash">GCash</option>
                <option value="Maya">Maya</option>
              </select>
            </div>
          </div>

          <h2>Additional Information</h2>
          <div class="form-group">
            <label for="requests">Special Requests</label>
            <textarea
              id="requests"
              name="requests"
              placeholder="Example: Extra bed, late check-in, room preference..."
              rows="4"
            ></textarea>
          </div>

          <div class="buttons">
            <button type="submit" class="confirm" name="submit">
              Confirm Booking
            </button>
            <button type="reset" class="cancel" name="reset">
              Cancel Booking
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
